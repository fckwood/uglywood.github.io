<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>uglywood</title>
<style>
  :root {
    --bg1: #120c1c;
    --bg2: #21143b;
    --bg3: #331e5c;
    --text: #ede7f6;
    --muted: #a99bc4;
    --card: rgba(255, 255, 255, 0.04);
    --card-border: rgba(180, 140, 255, 0.15);
    --accent: #b48cff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100%;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 50%, var(--bg3) 100%);
    background-attachment: fixed;
    overflow-x: hidden;
  }

  /* Мягкое свечение на фоне */
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.35;
    z-index: 0;
    pointer-events: none;
  }
  body::before {
    width: 450px; height: 450px;
    background: #6a3fc4;
    top: -150px; left: -150px;
  }
  body::after {
    width: 500px; height: 500px;
    background: #4a2d8a;
    bottom: -200px; right: -180px;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 440px;
    margin: 0 auto;
    padding: 50px 24px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  /* Верхняя панель с часами */
  .top-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--muted);
    font-family: monospace;
    letter-spacing: 1px;
    margin-bottom: -10px;
  }

  /* Аватарка */
  .avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background-image: url('avatar.jpg'); 
    background-size: cover;
    background-position: center;
    box-shadow:
      0 0 0 3px rgba(180, 140, 255, 0.2),
      0 0 35px rgba(140, 90, 230, 0.6);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: pointer;
  }
  .avatar:hover {
    transform: scale(1.05) rotate(3deg);
    box-shadow: 0 0 0 4px rgba(180, 140, 255, 0.4), 0 0 50px rgba(140, 90, 230, 0.8);
  }

  .nick {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #e6d9ff, #b48cff, #8f6fd6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-top: 5px;
  }

  /* Ссылки */
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 10px;
  }

  .btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 14px 20px;
    border-radius: 16px;
    text-decoration: none;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    overflow: hidden;
    transition: transform 0.2s ease, border-color 0.2s, box-shadow 0.25s;
    cursor: pointer;
  }

  .btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(180, 140, 255, 0.1), transparent);
    transform: translateX(-100%);
    transition: transform 0.6s ease;
  }

  .btn:hover {
    transform: translateY(-2px) scale(1.01);
    border-color: rgba(180, 140, 255, 0.5);
    box-shadow: 0 8px 25px rgba(110, 60, 190, 0.3);
  }
  .btn:hover::before { transform: translateX(100%); }

  .btn .icon {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    border-radius: 10px;
    display: grid;
    place-items: center;
    background: rgba(180, 140, 255, 0.12);
    font-size: 18px;
  }

  .btn .meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .btn .name { font-weight: 600; font-size: 15px; }
  .btn .handle { font-size: 12px; color: var(--muted); }

  .btn .action {
    margin-left: auto;
    color: var(--accent);
    font-size: 18px;
    transition: transform 0.2s;
  }
  .btn:hover .action { transform: translateX(3px); }

  /* Кнопка копирования для дискорда */
  .copy-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 18px;
    cursor: pointer;
    padding: 5px;
    transition: transform 0.2s, color 0.2s;
  }
  .copy-btn:hover { transform: scale(1.1); color: #fff; }

  .fade { opacity: 0; transform: translateY(15px); animation: appear 0.6s ease forwards; }
  @keyframes appear { to { opacity: 1; transform: translateY(0); } }
  .d1 { animation-delay: 0.1s; }
  .d2 { animation-delay: 0.2s; }
  .d3 { animation-delay: 0.3s; }
  .d4 { animation-delay: 0.4s; }
  .d5 { animation-delay: 0.5s; }
</style>
</head>
<body>
  <main class="wrap">
    
    <!-- Часы -->
    <div class="top-bar fade d1">
      <span>LOCAL TIME</span>
      <span id="clock">00:00:00</span>
    </div>

    <!-- Аватарка -->
    <div class="avatar fade d1" title="Bladee - Cold Visions"></div>
    
    <h1 class="nick fade d2">uglywood</h1>

    <nav class="links">
      <!-- Instagram -->
      <a class="btn fade d3" href="https://www.instagram.com/uglywoodd?rpxt=MXU1YzBvcTVxZThrcg==" target="_blank" rel="noopener">
        <span class="icon">📸</span>
        <span class="meta">
          <span class="name">Instagram</span>
          <span class="handle">@uglywoodd</span>
        </span>
        <span class="action">↗</span>
      </a>

      <!-- Discord (с копированием) -->
      <div class="btn fade d4" onclick="copyDiscord()" title="Нажми, чтобы скопировать ник">
        <span class="icon">🎮</span>
        <span class="meta">
          <span class="name">Discord</span>
          <span class="handle" id="discord-nick">uglywood</span>
        </span>
        <button class="copy-btn" id="copy-icon" title="Скопировать">📋</button>
      </div>

      <!-- Steam -->
      <a class="btn fade d5" href="https://steamcommunity.com/profiles/76561199219638137/" target="_blank" rel="noopener">
        <span class="icon">🕹️</span>
        <span class="meta">
          <span class="name">Steam</span>
          <span class="handle">profile</span>
        </span>
        <span class="action">↗</span>
      </a>
    </nav>

  </main>

  <script>
    // Часы
    function updateClock() {
      const now = new Date();
      const timeString = now.toLocaleTimeString('ru-RU', { hour12: false });
      document.getElementById('clock').textContent = timeString;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Копирование Discord
    function copyDiscord() {
      const nick = "uglywood";
      navigator.clipboard.writeText(nick).then(() => {
        const icon = document.getElementById('copy-icon');
        icon.textContent = '✅';
        setTimeout(() => { icon.textContent = '📋'; }, 1500);
      }).catch(err => {
        console.error('Ошибка копирования: ', err);
      });
    }
  </script>
</body>
</html>
